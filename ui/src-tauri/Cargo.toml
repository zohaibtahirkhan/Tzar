[package]
name = "tzar"
version = "0.1.0"
description = "Tzar — Local AI Assistant"
authors = ["Muhammad Zohaib Tahir"]
license = "Apache-2.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
