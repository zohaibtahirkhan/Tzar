[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short test summary for failures and errors
addopts =
    -v
    --tb=short
    --no-header
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: requires real models or hardware
